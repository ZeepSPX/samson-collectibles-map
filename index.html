#view{position:fixed;inset:0;touch-action:none;cursor:grab}
#view.drag{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#world img{display:block;box-shadow:0 0 0 2px #4a5762;user-select:none;-webkit-user-drag:none;image-rendering:auto}
.lbl{position:absolute;transform:translate(-50%,-50%) scale(var(--inv));white-space:nowrap;font-weight:700;font-size:13px;letter-spacing:.02em;
  color:#5d6a60;text-shadow:0 0 3px #e9e5da,0 0 3px #e9e5da,0 0 5px #e9e5da;pointer-events:none}
.lbl.big{font-size:20px;color:#7b8780}
body.nolabels .lbl{display:none}
.mk{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;transform:scale(var(--inv));cursor:pointer;display:grid;place-items:center;
  font-size:11px;font-weight:800;color:#fff;-webkit-tap-highlight-color:transparent}
.mk::before{content:"";position:absolute;inset:0;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.55)}
.mk span{position:relative;line-height:1;pointer-events:none}
.mk.car::before{background:var(--car);border-radius:50%}
.mk.combat::before{background:var(--combat);border-radius:50%}
.mk.board{width:22px;height:20px;margin:-12px 0 0 -11px}
.mk.board::before{background:var(--board);border:0;border-radius:0;clip-path:polygon(50% 0,100% 100%,0 100%);box-shadow:none;filter:drop-shadow(0 1px 1px rgba(0,0,0,.6))}
.mk.board span{top:4px;font-size:9px;color:#2a1700;display:none}
body.nums .mk.board span{display:block}
.mk.done::before{background:var(--done);opacity:.9}
.mk.done.board::before{background:var(--done)}
.mk.done span{color:#fff}
.mk.done::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:900;color:#fff}
.mk.board.done::after{top:3px;font-size:11px}
.mk.done span{display:none!important}
body.hidedone .mk.done{display:none}
.mk.hidden{display:none}
.mk.grp{display:none}
.cl{position:absolute;width:36px;height:36px;margin:-18px 0 0 -18px;transform:scale(var(--inv));border-radius:50%;cursor:pointer;display:grid;place-items:center;
  font-size:13px;font-weight:800;color:#fff;background:conic-gradient(var(--done) var(--p,0%),#fff 0);box-shadow:0 1px 4px rgba(0,0,0,.55);z-index:3;-webkit-tap-highlight-color:transparent}
.cl::before{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--bg,#1e262d)}
.cl span{position:relative;line-height:1;pointer-events:none}
.cl.hid{display:none}
.cl:focus-visible{outline:3px solid #111;outline-offset:2px}
.mk.sel{z-index:5}
.mk.sel::before{outline:3px solid #111;outline-offset:2px}
.mk.board.sel::before{outline:0;filter:drop-shadow(0 0 0 #000) drop-shadow(0 0 3px #000) drop-shadow(0 0 3px #000)}
.mk:focus-visible::before{outline:3px solid #111;outline-offset:2px}
/* panel */
#panel{position:fixed;left:12px;top:12px;width:300px;max-width:calc(100vw - 24px);background:var(--ink);border:1px solid var(--line);border-radius:10px;
  box-shadow:0 8px 28px rgba(0,0,0,.35);padding:12px 12px 10px;z-index:10;max-height:calc(100vh - 24px);overflow:auto}
#panel h1{font-size:16px;margin:0 0 2px;font-weight:700}
#panel .sub{margin:0 0 10px;font-size:12.5px;color:var(--mute)}
#head{display:flex;align-items:center;justify-content:space-between;gap:8px}
#fold{background:none;border:1px solid var(--line);color:var(--text);border-radius:6px;width:30px;height:30px;font-size:16px;cursor:pointer}
body.folded #panelbody{display:none}
.cat{display:grid;grid-template-columns:26px 1fr auto;gap:2px 10px;align-items:center;padding:8px 6px;border-top:1px solid var(--line)}
.cat .ic{width:22px;height:22px;display:block}
.ic.c{border-radius:50%;border:2px solid #fff}
.ic.car{background:var(--car)} .ic.combat{background:var(--combat)}
.ic.board{background:var(--board);clip-path:polygon(50% 0,100% 100%,0 100%);height:20px}
.cat .nm{font-size:14px;font-weight:600}
.cat .cnt{font-size:14px;font-variant-numeric:tabular-nums;font-weight:700}
.bar{grid-column:2 / 4;height:6px;background:var(--ink2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--done);width:0;transition:width .25s}
.cat label{grid-column:1 / 4;display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--mute);cursor:pointer;margin-top:2px}
.opts{border-top:1px solid var(--line);padding:8px 6px 4px;display:grid;gap:6px}
.opts label{display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer}
input[type=checkbox]{accent-color:var(--done);width:16px;height:16px;margin:0}
.btns{display:flex;flex-wrap:wrap;gap:6px;padding:8px 0 2px;border-top:1px solid var(--line);margin-top:6px}
button.b{background:var(--ink2);border:1px solid var(--line);color:var(--text);padding:7px 10px;border-radius:7px;font:inherit;font-size:13px;cursor:pointer}
button.b:hover{background:#34414b}
button.b.warn{color:#ffb4a8}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #8fd3ff;outline-offset:2px}
#jump{display:flex;gap:6px;padding:8px 6px 0;border-top:1px solid var(--line);margin-top:6px}
#jump select,#jump input{background:var(--ink2);border:1px solid var(--line);color:var(--text);border-radius:7px;padding:6px 8px;font:inherit;font-size:13px;min-width:0}
#jump input{width:70px}
#jump button{flex:none}
/* group list */
#grp{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:350px;max-width:calc(100vw - 24px);max-height:46vh;overflow:auto;
  background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;z-index:12;display:none;box-shadow:0 8px 28px rgba(0,0,0,.4)}
#grp.on{display:block}
#grp .gh{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700;font-size:14px;margin-bottom:6px}
#grp .gh button.b{padding:4px 9px}
#grp .row{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
#grp .row .n{font-size:13.5px;font-weight:600}
#grp .row .c{font-size:11.5px;color:var(--mute);font-variant-numeric:tabular-nums}
#grp .row.d .n{color:#7fd4c8}
#grp .all{margin-top:6px;width:100%}
/* zoom */
#zoom{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:grid;gap:6px;z-index:10}
#zoom button{width:42px;height:42px;font-size:20px;background:var(--ink);color:var(--text);border:1px solid var(--line);border-radius:9px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.3)}
/* info bar */
#info{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;gap:12px;align-items:center;z-index:11;
  box-shadow:0 8px 28px rgba(0,0,0,.4);max-width:calc(100vw - 80px);transition:opacity .15s,transform .15s}
#info.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#info .t{font-size:14px;font-weight:700}
#info .c{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums;margin-top:2px}
#info button{white-space:nowrap}
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--ink);border:1px solid var(--line);padding:8px 12px;border-radius:8px;font-size:13px;z-index:20;display:none}
#help{position:fixed;right:12px;top:12px;z-index:9;max-width:260px;font-size:12px;color:#33414a;background:rgba(244,247,248,.88);border-radius:8px;padding:8px 10px;line-height:1.4}
#help b{font-weight:700}
@media (max-width:640px){
  #panel{width:calc(100vw - 24px)}
  body:not(.folded) #help{display:none}
  #help{top:auto;bottom:calc(66px + env(safe-area-inset-bottom,0px));right:auto;left:12px;max-width:calc(100vw - 80px)}
  #info{max-width:calc(100vw - 72px);left:12px;transform:translate(0,20px)}
  #info.on{transform:translate(0,0)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.hb{display:flex;gap:6px;align-items:center}
.credit{margin:10px 0 0;font-size:11px;line-height:1.4;color:var(--mute)}
.credit a{color:var(--mute);text-decoration:underline}
.credit a:hover{color:var(--text)}
#lang{height:30px;padding:0 9px;font-weight:700;cursor:pointer}
</style>
</head>

/* ---------- pan / zoom ---------- */
var S=1,TX=0,TY=0,MIN=0.1,MAX=2.5;
/* marker size: counter-scale so markers stay readable but shrink a bit when zoomed far out */
function apply2(){
  world.style.transform="translate("+TX+"px,"+TY+"px) scale("+S+")";
  var eff=Math.min(Math.max(S,0.5),1.8);          // screen-size multiplier for markers
  world.style.setProperty("--inv",(eff/S).toFixed(4));
  if(S!==clLastS) schedule();

function clampPan(){
  var vw=view.clientWidth,vh=view.clientHeight,w=IMG_W*S,h=IMG_H*S,m=80;
  TX=w<=vw?(vw-w)/2:Math.min(m,Math.max(vw-w-m,TX));
  TY=h<=vh?(vh-h)/2:Math.min(m,Math.max(vh-h-m,TY));
}
function setView(){clampPan();apply2();}
function zoomAt(f,cx,cy){
  var ns=Math.min(MAX,Math.max(MIN,S*f)); if(ns===S) return;
  TX=cx-(cx-TX)*(ns/S); TY=cy-(cy-TY)*(ns/S); S=ns; setView();
}
function fit(){
  var vw=view.clientWidth,vh=view.clientHeight;
  var inset=(!document.body.classList.contains("folded")&&vw>900)?324:0;   // keep the panel off the map
  var aw=vw-inset;
  // fit the area that contains the markers (with margin), not the whole sheet
  var b=bounds(), pad=140, w=b.x1-b.x0+pad*2, h=b.y1-b.y0+pad*2;
  S=Math.min(aw/w,vh/h); MIN=Math.min(S,vw/IMG_W,vh/IMG_H)*0.9;
  TX=inset+aw/2-(b.x0+b.x1)/2*S; TY=vh/2-(b.y0+b.y1)/2*S; setView();
}
function bounds(){
  var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  MARKERS.forEach(function(m){x0=Math.min(x0,m.x);y0=Math.min(y0,m.y);x1=Math.max(x1,m.x);y1=Math.max(y1,m.y);});
  return {x0:x0,y0:y0,x1:x1,y1:y1};
}
function focusOn(m,scale){
  S=Math.max(S,scale||1.0); var vw=view.clientWidth,vh=view.clientHeight;
  TX=vw/2-m.x*S; TY=vh/2-m.y*S; setView();
}
document.getElementById("zin").addEventListener("click",function(){zoomAt(1.4,view.clientWidth/2,view.clientHeight/2);});

  e.preventDefault();

},{passive:false});

var ptrs={}, drag=null, moved=0, pinch=null, downMarker=null, downCluster=null;
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
view.addEventListener("pointerdown",function(e){
  if(e.target.closest("#panel,#zoom,#info,#help")) return;
  var hp=document.getElementById("help"); if(hp) hp.style.display="none";
  view.setPointerCapture(e.pointerId);
  ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
  var ids=Object.keys(ptrs);
  if(ids.length===1){
    drag={x:e.clientX,y:e.clientY,tx:TX,ty:TY}; moved=0;
    var mk=e.target.closest&&e.target.closest(".mk"); downMarker=mk?mk.dataset.k:null;
    var cl=e.target.closest&&e.target.closest(".cl"); downCluster=cl||null;
  } else if(ids.length===2){
    var a=ptrs[ids[0]],b=ptrs[ids[1]];
    pinch={d:dist(a,b),s:S}; drag=null; downMarker=null; downCluster=null; moved=99;
  }
});
view.addEventListener("pointermove",function(e){
  if(!ptrs[e.pointerId]) return;
  ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
  var ids=Object.keys(ptrs);
  if(ids.length===2&&pinch){
    var a=ptrs[ids[0]],b=ptrs[ids[1]];
    var cx=(a.x+b.x)/2,cy=(a.y+b.y)/2;
    var ns=Math.min(MAX,Math.max(MIN,pinch.s*dist(a,b)/pinch.d));
    zoomAt(ns/S,cx,cy);
  } else if(drag){
    var dx=e.clientX-drag.x,dy=e.clientY-drag.y; moved=Math.max(moved,Math.hypot(dx,dy));
    if(moved>5){view.classList.add("drag");TX=drag.tx+dx;TY=drag.ty+dy;setView();}
  }
});
function endPtr(e){
  if(!ptrs[e.pointerId]) return;
  delete ptrs[e.pointerId];
  if(Object.keys(ptrs).length<2) pinch=null;
  if(Object.keys(ptrs).length===0){
    view.classList.remove("drag");
    if(drag&&moved<=5){
      if(downMarker) toggle(downMarker);
      else if(downCluster) clusterClick(downCluster._m);
      else {select(null);closeGrp();}
    }
    drag=null; downMarker=null; downCluster=null;
  }
}
view.addEventListener("pointerup",endPtr);
view.addEventListener("pointercancel",function(e){delete ptrs[e.pointerId];pinch=null;drag=null;view.classList.remove("drag");});
view.addEventListener("keydown",function(e){
  var t=e.target;
  if((e.key==="Enter"||e.key===" ")&&t.classList&&t.classList.contains("mk")){e.preventDefault();toggle(t.dataset.k);}
  else if((e.key==="Enter"||e.key===" ")&&t.classList&&t.classList.contains("cl")){e.preventDefault();clusterClick(t._m);}

  else if(e.key==="+"||e.key==="="){zoomAt(1.25,view.clientWidth/2,view.clientHeight/2);}
  else if(e.key==="-"){zoomAt(0.8,view.clientWidth/2,view.clientHeight/2);}
  else if(e.key==="ArrowLeft"){TX+=60;setView();} else if(e.key==="ArrowRight"){TX-=60;setView();}
  else if(e.key==="ArrowUp"){TY+=60;setView();} else if(e.key==="ArrowDown"){TY-=60;setView();}
});

  if(!byKey[k]){toast(t("noNumber")+MARKERS.filter(function(m){return m.c===c;}).length+".");return;}

/* ---------- grouping of nearby markers ---------- */
var SORTED=MARKERS.slice().sort(function(a,b){return a.y-b.y||a.x-b.x;});
var clEls=[], clLastS=-1, clRaf=0, grpMembers=null;
var CAT_COLOR={board:"var(--board)",car:"var(--car)",combat:"var(--combat)"};
function schedule(){ if(clRaf) return; clRaf=requestAnimationFrame(function(){clRaf=0;recluster();}); }
function effS(s){return Math.min(Math.max(s,0.5),1.8);}
function isVis(m){return catUI[m.c].chk.checked && !(document.body.classList.contains("hidedone")&&done[m.k]);}
function clusterize(items,s){
  var R=24*effS(s), R2=R*R, out=[], used=[];
  for(var i=0;i<items.length;i++){
    if(used[i]) continue; used[i]=true; var g=[items[i]];
    for(var j=i+1;j<items.length;j++){
      if(used[j]) continue;
      var dx=(items[i].x-items[j].x)*s, dy=(items[i].y-items[j].y)*s;
      if(dx*dx+dy*dy<R2){used[j]=true;g.push(items[j]);}
    }
    out.push(g);
  }
  return out;
}
function recluster(){
  clLastS=S;
  var on=document.getElementById("optGroup").checked;
  var items=SORTED.filter(isVis);
  var groups=on?clusterize(items,S):[];
  MARKERS.forEach(function(m){els[m.k].classList.remove("grp");});
  var ci=0;
  groups.forEach(function(g){
    if(g.length<2) return;
    g.forEach(function(m){els[m.k].classList.add("grp");});
    var el=clEls[ci];
    if(!el){
      el=document.createElement("div"); el.className="cl"; el.setAttribute("role","button"); el.tabIndex=0;
      el.appendChild(document.createElement("span")); world.appendChild(el); clEls[ci]=el;
    }
    el.classList.remove("hid");
    var cx=0,cy=0,d=0,cats={},nc=0;
    g.forEach(function(m){cx+=m.x;cy+=m.y;if(done[m.k])d++;if(!cats[m.c]){cats[m.c]=0;nc++;}cats[m.c]++;});
    cx/=g.length; cy/=g.length;
    var all=(d===g.length);
    el.style.left=cx+"px"; el.style.top=cy+"px";
    el.style.setProperty("--p",(100*d/g.length)+"%");
    el.style.setProperty("--bg",all?"var(--done)":(nc===1?CAT_COLOR[g[0].c]:"#1e262d"));
    el.firstChild.textContent=g.length;
    var parts=[]; if(cats.board)parts.push(t("pBoard")+cats.board); if(cats.car)parts.push(t("pCar")+cats.car); if(cats.combat)parts.push(t("pCombat")+cats.combat);
    var label=t("nearItems")+g.length+" ("+parts.join(", ")+"), "+t("doneN")+d;
    el.title=label; el.setAttribute("aria-label",label);
    el._m=g; ci++;
  });
  for(;ci<clEls.length;ci++){clEls[ci].classList.add("hid");clEls[ci]._m=null;}
}
function clusterClick(g){
  if(!g) return;
  var cx=0,cy=0; g.forEach(function(m){cx+=m.x;cy+=m.y;}); cx/=g.length; cy/=g.length;
  var next=null;
  if(S<MAX-0.001){
    for(var t=S*1.2;;t*=1.2){
      if(t>MAX) t=MAX;
      if(clusterize(g,t).length>1){next=t;break;}
      if(t>=MAX) break;
    }
  }
  if(next){
    S=next; TX=view.clientWidth/2-cx*S; TY=view.clientHeight/2-cy*S; setView(); closeGrp();
  } else openGrp(g);
}
function openGrp(g){
  grpMembers=g.slice().sort(function(a,b){return (a.c<b.c?-1:a.c>b.c?1:a.n-b.n);});
  renderGrp(); document.getElementById("grp").classList.add("on");
}
function closeGrp(){grpMembers=null;document.getElementById("grp").classList.remove("on");}
function refreshGrp(){if(grpMembers) renderGrp();}
function el(tag,cls,txt){var e=document.createElement(tag); if(cls)e.className=cls; if(txt!==undefined)e.textContent=txt; return e;}
function renderGrp(){
  var box=document.getElementById("grp"); box.textContent="";
  var head=el("div","gh"); head.appendChild(el("span","",t("nearHead")(grpMembers.length)));
  var x=el("button","b",t("close")); x.type="button"; x.addEventListener("click",closeGrp); head.appendChild(x); box.appendChild(head);
  grpMembers.forEach(function(m){
    var row=el("div","row"+(done[m.k]?" d":""));
    row.appendChild(el("span","ic "+(m.c==="board"?"board":"c "+m.c)));
    var mid=el("div"); mid.appendChild(el("div","n",itemName(m)+(done[m.k]?t("collected"):"")));
    mid.appendChild(el("div","c","X "+fmt(m.X)+"   Y "+fmt(m.Y)+"   Z "+fmt(m.Z))); row.appendChild(mid);
    var b=el("button","b",done[m.k]?t("unmarkShort"):t("doneShort")); b.type="button";
    b.addEventListener("click",function(){toggle(m.k);}); row.appendChild(b); box.appendChild(row);
  });
  var allDone=grpMembers.every(function(m){return done[m.k];});
  var all=el("button","b all",allDone?t("unmarkAll"):t("markAll")); all.type="button";
  all.addEventListener("click",function(){
    grpMembers.forEach(function(m){if(allDone)delete done[m.k];else done[m.k]=true;});
    lastAction=null; save(); refresh();
  });
  box.appendChild(all);
}
document.addEventListener("keydown",function(e){if(e.key==="Escape") closeGrp();});
(function(){
  var g=document.getElementById("optGroup");
  g.checked=prefs.group!==false;
  g.addEventListener("change",function(){prefs.group=g.checked;savePrefs();closeGrp();schedule();});
